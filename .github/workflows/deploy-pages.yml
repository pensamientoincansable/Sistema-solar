# Despliegue a GitHub Pages
#
# GitHub Pages NO puede servir el código fuente tal cual: index.html carga
# /src/main.js (ruta absoluta que no existe bajo /Sistema-solar/) y el código
# importa 'three' como módulo "bare", que el navegador no sabe resolver.
# Por eso el juego se quedaba en "INICIANDO SISTEMA SOLAR...".
#
# Este workflow compila con Vite y publica dist/ (ya con rutas relativas y
# Three.js empaquetado) usando el despliegue oficial de Pages.
#
# REQUISITO: en Settings → Pages → "Build and deployment" → Source debe estar
# en "GitHub Actions" (no "Deploy from a branch").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
